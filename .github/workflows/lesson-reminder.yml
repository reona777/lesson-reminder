name: Lesson Reminder

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true にすると送信せずログ確認だけ実行。false で本番送信。"
        required: false
        default: "true"
      test_notify:
        description: "true にすると失敗していなくてもSlackの失敗通知を1回送る（通知の疎通確認用）。"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: lesson-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Tokyo
      SF_USERNAME: ${{ secrets.SF_USERNAME }}
      SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
      SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
      GAS_URL: ${{ secrets.GAS_URL }}
      ROSTER_TOKEN: ${{ secrets.ROSTER_TOKEN }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      SLACK_TEACHER_WEBHOOK: ${{ secrets.SLACK_TEACHER_WEBHOOK }}
      CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
      PARENT_LINE_SPREADSHEET_ID: ${{ secrets.PARENT_LINE_SPREADSHEET_ID }}
      PARENT_LINE_SHEET_NAME: ${{ secrets.PARENT_LINE_SHEET_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ディスパッチ時点の固定SHAではなく実行時点の最新ブランチを取得する。
          # ランナー遅延で先行runのマーカーpush後に実行が始まっても、
          # マーカーを正しく検出して二重送信を防ぐため。
          ref: master

      - name: Set state file
        id: state
        run: |
          SENT_DATE=$(date +%F)
          SENT_FILE=".lesson-reminder-state/${SENT_DATE}.txt"
          echo "date=${SENT_DATE}" >> "$GITHUB_OUTPUT"
          echo "file=${SENT_FILE}" >> "$GITHUB_OUTPUT"
          echo "Sent marker file: ${SENT_FILE}"

      - name: Check sent marker
        id: sent_marker
        run: |
          if [ -f "${{ steps.state.outputs.file }}" ]; then
            echo "sent=true" >> "$GITHUB_OUTPUT"
            echo "Already sent today. Skipping production send."
          else
            echo "sent=false" >> "$GITHUB_OUTPUT"
            echo "No sent marker found for today."
          fi

      - name: Set up Python
        if: steps.sent_marker.outputs.sent != 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != 'false')
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.sent_marker.outputs.sent != 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != 'false')
        run: pip install -r requirements.txt

      - name: Run reminder
        if: steps.sent_marker.outputs.sent != 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != 'false')
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" != "false" ]; then
            echo "Manual run dry_run is enabled. No LINE/Slack messages will be sent."
            python lesson_reminder_runner.py --dry-run
          elif [ "${{ steps.sent_marker.outputs.sent }}" = "true" ]; then
            echo "Already sent today. No LINE/Slack messages will be sent."
          else
            echo "Production run. LINE/Slack messages will be sent."
            python lesson_reminder_runner.py
          fi

      - name: Record sent marker
        if: success() && steps.sent_marker.outputs.sent != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run != 'false')
        run: |
          mkdir -p .lesson-reminder-state
          {
            echo "sent_at_jst=$(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
          } > "${{ steps.state.outputs.file }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.state.outputs.file }}"
          git commit -m "Record reminder sent ${{ steps.state.outputs.date }}"
          # push中に他のcommitが先行してもnon-fast-forwardで落ちないようにする
          git pull --rebase origin master
          git push

      # 失敗しても誰も気づけず、生徒に届かないまま終わる事故を防ぐ。
      # マーカーを残さないので、次のディスパッチが自動リトライになる。
      - name: Notify Slack on failure
        if: ${{ failure() || inputs.test_notify == 'true' }}
        run: |
          if [ "${{ inputs.test_notify }}" = "true" ]; then
            HEAD_LINE=":test_tube: [疎通テスト] リマインドの失敗通知です。実際の失敗ではありません。"
          else
            HEAD_LINE=":rotating_light: リマインドが失敗しました。生徒へのLINEが未送信の可能性があります。"
          fi
          TEXT=$(printf '%s\n実行: %s JST' "$HEAD_LINE" "$(date '+%m/%d %H:%M')")
          jq -n --arg text "$TEXT" '{text: $text}' \
            | curl -sS -f -X POST -H 'Content-type: application/json' -d @- "$SLACK_WEBHOOK"
